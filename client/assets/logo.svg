<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="55" fill="url(#gradient)" stroke="#1E40AF" stroke-width="2"/>
  
  <!-- Document icon -->
  <rect x="35" y="30" width="30" height="40" rx="3" fill="white" opacity="0.9"/>
  <rect x="70" y="35" width="25" height="35" rx="3" fill="white" opacity="0.7"/>
  
  <!-- AI brain/neural network pattern -->
  <circle cx="45" cy="45" r="2" fill="#1E40AF"/>
  <circle cx="55" cy="40" r="2" fill="#1E40AF"/>
  <circle cx="50" cy="55" r="2" fill="#1E40AF"/>
  <circle cx="75" cy="50" r="2" fill="#1E40AF"/>
  <circle cx="80" cy="45" r="2" fill="#1E40AF"/>
  
  <!-- Connecting lines -->
  <line x1="45" y1="45" x2="55" y2="40" stroke="#1E40AF" stroke-width="1" opacity="0.8"/>
  <line x1="55" y1="40" x2="50" y2="55" stroke="#1E40AF" stroke-width="1" opacity="0.8"/>
  <line x1="50" y1="55" x2="75" y2="50" stroke="#1E40AF" stroke-width="1" opacity="0.8"/>
  <line x1="75" y1="50" x2="80" y2="45" stroke="#1E40AF" stroke-width="1" opacity="0.8"/>
  
  <!-- Text -->
  <text x="60" y="85" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Invoice</text>
  <text x="60" y="98" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">AI</text>
</svg>